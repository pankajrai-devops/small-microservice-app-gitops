name: CI Pipeline
on:
  push:
    branches: [ main, pankajrai-devops-patch-1 ]
  pull_request: 
    branches: [ main ]
jobs:
  tar_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: java --version
      - name: Build package
        working-directory: ./webapp
        run: mvn clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pankaj-war
          path: "/pankaj.war"
