name: CI Pipeline
on:
  push:
    branches: 
      - main
      - qa
      - prod
    paths:
      - 'webapp/**'
      - 'db/**'

env:
  app_dir: "./webapp"
  db_dir: "./db"
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  #change detector to make monorepos little smart to know whats changed but I really dont favor mono repos because they add lot of complications
  #if we really have microservices and they are truly independent as such we should consider separate repo for each of the project
  change_detections:
    runs-on: ubuntu-latest
    outputs:
      webapp_changed: ${{ steps.filter.outputs.webapp }}
      db_changed: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: parent
        run: echo "sha=$(git rev-parse HEAD~1 2>/dev/null || echo 'HEAD')" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.parent.outputs.sha }}
          filters: |
            webapp:
              - 'webapp/**'
            db:
              - 'db/**'

  tar_build:
    runs-on: ubuntu-latest
    needs: change_detections
    # Always build on promotion branches, or if changes are caught in feature builds
    if: github.ref_name != 'main' || needs.change_detections.outputs.webapp_changed == 'true'
    defaults:
      run:
        working-directory: ${{ env.app_dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn clean package
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: registration-app.war
          path: ${{ github.workspace }}/webapp/target/registration-app.war

  webapp_image_build:
    runs-on: ubuntu-latest
    needs: [change_detections, tar_build]
    if: github.ref_name != 'main' || needs.change_detections.outputs.webapp_changed == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: registration-app.war
          path: ${{ github.workspace }}/webapp/
      - name: Github Container Registry Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PANKAJ_GHCR }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Webapp Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.app_dir }}
          file: ${{ env.app_dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/pankaj-webapp:latest
            ghcr.io/${{ env.GHCR_OWNER }}/pankaj-webapp:${{ github.sha }}

  db_image_build:
    runs-on: ubuntu-latest
    needs: change_detections
    if: github.ref_name != 'main' || needs.change_detections.outputs.db_changed == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Github Container Registry Login DB
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PANKAJ_GHCR }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push DB Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.db_dir }}
          file: ${{ env.db_dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/pankaj-db:latest
            ghcr.io/${{ env.GHCR_OWNER }}/pankaj-db:${{ github.sha }}

  # ====================================================================
  # GITOPS ENV GENERATORS
  # ====================================================================
  gitops_dev_sync:
    runs-on: ubuntu-latest
    needs: [change_detections, webapp_image_build, db_image_build]
    if: always() && github.ref_name == 'main'
    steps:
      - name: Checkout Helm Monorepo Configuration
        uses: actions/checkout@v7
        with:
          repository: 'pankajrai/micro-services-helm-monorepo'
          token: ${{ secrets.PANKAJ_GHCR }}
          path: 'micro-services-helm-monorepo'

      - name: Direct Deploy to Dev Environment (HEAD)
        run: |
          cd micro-services-helm-monorepo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          if [ "${{ needs.change_detections.outputs.webapp_changed }}" = "true" ]; then
            sed -i "s/tag:.*/tag: ${{ github.sha }}/g" environments/dev/tomcat-values.yaml
            git add environments/dev/tomcat-values.yaml
          fi
          if [ "${{ needs.change_detections.outputs.db_changed }}" = "true" ]; then
            sed -i "s/tag:.*/tag: ${{ github.sha }}/g" environments/dev/postgres-values.yaml
            git add environments/dev/postgres-values.yaml
          fi
          git commit -m "gitops(dev): auto-update dev to version ${{ github.sha }} [skip ci]" || echo "No changes"
          git push origin main

  gitops_qa_sync:
    runs-on: ubuntu-latest
    needs: [change_detections, webapp_image_build, db_image_build]
    if: always() && github.ref_name == 'qa'
    steps:
      - name: Checkout Helm Monorepo Configuration
        uses: actions/checkout@v7
        with:
          repository: 'pankajrai/micro-services-helm-monorepo'
          token: ${{ secrets.PANKAJ_GHCR }}
          path: 'helm-repo'

      - name: Process QA Manifest Tag Release
        run: |
          cd helm-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          
          sed -i "s/tag:.*/tag: ${{ github.sha }}/g" environments/qa/tomcat-values.yaml
          sed -i "s/tag:.*/tag: ${{ github.sha }}/g" environments/qa/postgres-values.yaml
          git add environments/qa/*.yaml
          git commit -m "gitops(qa): stable sync to ${{ github.sha }} [skip ci]" || echo "No changes"
          git push origin main
          
          QA_TAG="qa-release-${TIMESTAMP}"
          git tag $QA_TAG HEAD
          git push origin refs/tags/$QA_TAG
          echo "✅ QA Version Promoted Safely via PR: $QA_TAG"

  gitops_prod_sync:
    runs-on: ubuntu-latest
    needs: [change_detections, webapp_image_build, db_image_build]
    if: always() && github.ref_name == 'prod'
    # 🎯 MANUAL REVIEW SECURITY BOUNDARY
    environment: production
    steps:
      - name: Checkout Helm Monorepo Configuration
        uses: actions/checkout@v7
        with:
          repository: 'pankajrai/micro-services-helm-monorepo'
          token: ${{ secrets.PANKAJ_GHCR }}
          path: 'helm-repo'

      - name: Process Secure Production Deployment
        run: |
          cd helm-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          
          sed -i "s/tag:.*/tag: ${{ github.sha }}/g" environments/prod/tomcat-values.yaml
          sed -i "s/tag:.*/tag: ${{ github.sha }}/g" environments/prod/postgres-values.yaml
          git add environments/prod/*.yaml
          git commit -m "gitops(prod): verified production deployment [skip ci]" || echo "No changes"
          git push origin main
          
          PROD_TAG="prod-release-${TIMESTAMP}"
          git tag $PROD_TAG HEAD
          git push origin refs/tags/$PROD_TAG
          echo "🏆 Production Version Released Natively: $PROD_TAG"
