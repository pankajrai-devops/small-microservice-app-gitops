name: CI Pipeline
on:
  push:
    branches: [ main, pankajrai-devops-patch-1 ]
  pull_request: 
    branches: [ main ]
env:
  app_dir: "./webapp"
  db_dir: "./db"
jobs:
  tar_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.app_dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: |
          java --version
          mvn clean package
          ls -lart
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pankaj-war
          path: /home/runner/work/small-microservice-app-gitops/small-microservice-app-gitops/webapp/target/registration-app.war
