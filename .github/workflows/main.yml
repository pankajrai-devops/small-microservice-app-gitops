name: CI Pipeline
on:
  push:
    branches: [ main, pankajrai-devops-patch-1 ]
    paths:
      - 'webapp/**'
      - 'db/**'
env:
  app_dir: "./webapp"
  db_dir: "./db"
jobs:
  #change detector to make monorepos little smart to know whats changed but I really dont favor mono repos because they add lot of complications
  #if we really have microservices and they are truly independent as such we should consider separate repo for each of the project
  change_detections:
    runs-on: ubuntu-latest
    outputs:
      webapp_changed: ${{ steps.filter.outputs.webapp }}
      db_changed: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            webapp:
              - 'webapp/**'
            db:
              - 'db/**'
  tar_build:
    runs-on: ubuntu-latest
    needs: change_detections
    if: ${{ needs.change_detections.outputs.webapp_changed == 'true' }}
    defaults:
      run:
        working-directory: ${{ env.app_dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: |
          java --version
          mvn clean package
          ls -lart
          echo ${{ github.workspace }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ github.workspace }}/webapp/target/registration-app.war
  webapp_image_build:
    runs-on: ubuntu-latest
    needs: [change_detections , tar_build]
    if: ${{ needs.change_detections.outputs.webapp_changed == 'true' }}
    defaults:
      run:
        working-directory: ${{ env.app_dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: registration-app.war
          path: ${{ github.workspace }}/webapp/
      - name: Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PANKAJ_GHCR }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pankaj-webapp:latest
            ghcr.io/pankaj-webapp:${{ github.sha }}
  db_image_build:
    runs-on: ubuntu-latest
    needs: change_detections
    if: ${{ needs.change_detections.outputs.db_changed == 'true' }}
    defaults:
      run:
        working-directory: ${{ env.db_dir }}
    steps:
      - uses: actions/checkout@v7
      - name: Github Container Registry DB
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PANKAJ_GHCR }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pankaj-db:latest
            ghcr.io/pankaj-db:${{ github.sha }}
